<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>2e Core - Architecture V3 (Bulletproof)</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050505; color: #00ff00; font-family: monospace; }
        #videoElement { position: absolute; opacity: 0; pointer-events: none; }
        #ui-layer { position: absolute; top: 10px; left: 10px; z-index: 10; pointer-events: none; background: rgba(0,0,0,0.8); padding: 10px; border-left: 2px solid #00ff00;}
        .error-text { color: #ff3333; display: none; margin-top: 5px; font-weight: bold; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
</head>
<body>
    <div id="ui-layer">
        <div id="telemetry">>> Booting V3 Core...</div>
        <div id="fallback-msg" class="error-text">⚠️ WIX CORS BLOCK. GEOMETRÍA PROCEDURAL ACTIVADA PARA TESTEO.</div>
    </div>
    <video id="videoElement" autoplay playsinline></video>

    <script type="module">
        // Importación Nativa ES Modules (Skypack evita conflictos de dependencias)
        import * as THREE from 'https://cdn.skypack.dev/three@0.128.0';
        import { GLTFLoader } from 'https://cdn.skypack.dev/three@0.128.0/examples/jsm/loaders/GLTFLoader.js';
        import GUI from 'https://cdn.skypack.dev/lil-gui';

        const log = (msg) => document.getElementById('telemetry').innerText = ">> " + msg;
        const triggerFallback = () => document.getElementById('fallback-msg').style.display = 'block';

        // ==========================================
        // 1. SYSTEM OVERRIDE (GUI)
        // ==========================================
        const params = { rotation: true, float: true, breathe: true, distort: false, mediaPipe: false, distortionSpeed: 3.0, distortionAmount: 0.2 };
        const gui = new GUI({ title: '2e Override Panel' });
        gui.add(params, 'rotation').name('Rotación Lenta');
        gui.add(params, 'float').name('Levitar (Y)');
        gui.add(params, 'breathe').name('Respirar (Scale)');
        gui.add(params, 'distort').name('Liquify Shader');
        gui.add(params, 'mediaPipe').name('LIVE Face Tracking');
        
        const shFolder = gui.addFolder('Shader Params');
        shFolder.add(params, 'distortionSpeed', 0.1, 10.0);
        shFolder.add(params, 'distortionAmount', 0.0, 1.0);

        // ==========================================
        // 2. MOTOR THREE.JS CORE
        // ==========================================
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 100);
        camera.position.z = 5;
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 1.2));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(0, 5, 5);
        scene.add(dirLight);

        // ==========================================
        // 3. PIPELINE DE TEXTURA Y SHADER
        // ==========================================
        const video = document.getElementById('videoElement');
        const videoTexture = new THREE.VideoTexture(video);
        videoTexture.minFilter = THREE.LinearFilter;
        videoTexture.magFilter = THREE.LinearFilter;

        const customUniforms = {
            uTime: { value: 0 },
            uDistortActive: { value: 0 },
            uDistortionSpeed: { value: params.distortionSpeed },
            uDistortionAmount: { value: params.distortionAmount }
        };

        let targetObject = new THREE.Group();
        scene.add(targetObject);

        const applyMaterial = (mesh) => {
            mesh.material = new THREE.MeshStandardMaterial({ map: videoTexture, roughness: 0.3, metalness: 0.2 });
            mesh.material.onBeforeCompile = (shader) => {
                shader.uniforms.uTime = customUniforms.uTime;
                shader.uniforms.uDistortActive = customUniforms.uDistortActive;
                shader.uniforms.uDistortionSpeed = customUniforms.uDistortionSpeed;
                shader.uniforms.uDistortionAmount = customUniforms.uDistortionAmount;
                shader.vertexShader = `
                    uniform float uTime; uniform float uDistortActive; uniform float uDistortionSpeed; uniform float uDistortionAmount;
                    ${shader.vertexShader}
                `.replace(
                    `#include <begin_vertex>`,
                    `#include <begin_vertex>
                    if(uDistortActive > 0.5) {
                        float wave1 = sin(position.y * 5.0 + uTime * uDistortionSpeed) * uDistortionAmount;
                        float wave2 = cos(position.x * 5.0 + uTime * uDistortionSpeed) * uDistortionAmount;
                        transformed += normal * (wave1 + wave2);
                    }`
                );
            };
        };

        // ==========================================
        // 4. DESPLIEGUE GEOMÉTRICO (FAILSAFE INTEGRADO)
        // ==========================================
        log("Haciendo fetch al GLB de Wix...");
        const loader = new GLTFLoader();
        
        loader.load(
            'https://static.wixstatic.com/3d/fe81a7_cf1ed4e58d0048efa955f39d347a9466.glb',
            (gltf) => {
                log("GLB Extraído con éxito. Mapeando video...");
                const model = gltf.scene;
                model.traverse((child) => { if (child.isMesh) applyMaterial(child); });
                const box = new THREE.Box3().setFromObject(model);
                model.position.sub(box.getCenter(new THREE.Vector3()));
                targetObject.add(model);
            },
            undefined, // onProgress
            (err) => {
                // Si Wix rechaza la conexión, el sistema NO muere. Genera una forma base para testear el código.
                console.warn("Cross-Origin Block interceptado. Inyectando modelo base.", err);
                triggerFallback();
                log("Fallback listo. Puedes testear Shaders y Tracking.");
                const geo = new THREE.IcosahedronGeometry(1.5, 30); // Alto poly para que el Liquify se vea bien
                const mesh = new THREE.Mesh(geo);
                applyMaterial(mesh);
                targetObject.add(mesh);
            }
        );

        // ==========================================
        // 5. MEDIAPIPE VOLUMETRICO
        // ==========================================
        let facePosition = new THREE.Vector3(0, 0, 0);
        let faceRotation = new THREE.Euler(0, 0, 0);

        const faceMesh = new FaceMesh({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}` });
        faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
        
        faceMesh.onResults((res) => {
            if (!params.mediaPipe || !res.multiFaceLandmarks || res.multiFaceLandmarks.length === 0) return;
            const nose = res.multiFaceLandmarks[0][1];
            const leftEye = res.multiFaceLandmarks[0][33];
            const rightEye = res.multiFaceLandmarks[0][263];
            
            facePosition.set((nose.x - 0.5) * -5, -(nose.y - 0.5) * 5, nose.z * -10);
            faceRotation.set((nose.y - 0.5) * -Math.PI, (nose.x - 0.5) * -Math.PI, Math.atan2(rightEye.y - leftEye.y, rightEye.x - leftEye.x));
        });

        // ==========================================
        // 6. MOTOR DE HARDWARE (CÁMARA)
        // ==========================================
        log("Hardware Check: Solicitando Cámara...");
        navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } })
            .then((stream) => {
                video.srcObject = stream;
                video.addEventListener('loadeddata', () => {
                    log("SISTEMA ONLINE. Modifica parámetros en el GUI.");
                    const processFrame = async () => {
                        if (params.mediaPipe) await faceMesh.send({ image: video });
                        requestAnimationFrame(processFrame);
                    };
                    processFrame();
                });
            }).catch(e => {
                log("ERROR FATAL: Cámara denegada o hardware ocupado.");
                console.error(e);
            });

        // ==========================================
        // 7. RENDER LOOP ACTIVO
        // ==========================================
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();
            
            customUniforms.uTime.value = time;
            customUniforms.uDistortActive.value = params.distort ? 1.0 : 0.0;
            customUniforms.uDistortionSpeed.value = params.distortionSpeed;
            customUniforms.uDistortionAmount.value = params.distortionAmount;

            if (params.mediaPipe) {
                targetObject.position.lerp(facePosition, 0.1);
                targetObject.quaternion.slerp(new THREE.Quaternion().setFromEuler(faceRotation), 0.1);
            } else {
                targetObject.position.lerp(new THREE.Vector3(0, params.float ? Math.sin(time*2)*0.3 : 0, 0), 0.1);
                if (params.rotation) targetObject.rotation.y += 0.01;
                const scale = params.breathe ? 1 + Math.sin(time*3)*0.05 : 1;
                targetObject.scale.lerp(new THREE.Vector3(scale, scale, scale), 0.1);
            }
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
