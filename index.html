<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SGX Pillars Showcase</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #d1d5db; 
            font-family: 'Courier New', monospace;
            color: #1a1a1a;
            touch-action: none;
        }
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            pointer-events: none;
            border-left: 4px solid #00FFFF;
            padding-left: 15px;
            background: rgba(10, 13, 20, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 15px;
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%);
            transition: border-left-color 1s ease;
        }
        h2 {
            margin: 0 0 5px 0;
            font-size: 1.5rem;
            color: #ffffff;
            letter-spacing: 2px;
        }
        p {
            margin: 0;
            font-size: 0.9rem;
            color: #32527B;
            font-weight: bold;
        }
        .blink {
            animation: blinker 1.5s linear infinite;
        }
        @keyframes blinker {
            50% { opacity: 0; }
        }
        
        #VRButton {
            background: rgba(50, 82, 123, 0.9) !important;
            border: 1px solid #00FFFF !important;
            color: #00FFFF !important;
            font-family: 'Courier New', monospace !important;
            font-weight: bold !important;
            text-transform: uppercase !important;
            box-shadow: 0 4px 15px rgba(0, 255, 255, 0.3) !important;
            left: calc(50% - 120px) !important;
            width: 110px !important;
        }

        #ARButton {
            background: rgba(253, 204, 13, 0.9) !important;
            border: 1px solid #FDCC0D !important;
            color: #111827 !important;
            font-family: 'Courier New', monospace !important;
            font-weight: bold !important;
            text-transform: uppercase !important;
            box-shadow: 0 4px 15px rgba(253, 204, 13, 0.4) !important;
            left: calc(50% + 10px) !important;
            width: 110px !important;
        }

        #GyroButton {
            position: absolute;
            background: rgba(50, 82, 123, 0.9);
            border: 1px solid #32527B;
            color: #ffffff;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(50, 82, 123, 0.4);
            bottom: 80px;
            left: calc(50% - 60px);
            width: 120px;
            padding: 10px 0;
            cursor: pointer;
            z-index: 999;
            transition: all 0.3s ease;
            border-radius: 4px;
        }

        #ExitButton {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(184, 115, 51, 0.9); /* Copper */
            border: 1px solid #FDCC0D;
            color: #FDCC0D;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(253, 204, 13, 0.4);
            padding: 12px 20px;
            cursor: pointer;
            z-index: 1000;
            display: none; /* Oculto por defecto en el HUB */
            transition: all 0.3s ease;
            clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px);
        }
        #ExitButton:hover {
            background: #FDCC0D;
            color: #050505;
        }

        #loading-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(209, 213, 219, 0.95); 
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #32527B;
            font-family: 'Courier New', monospace;
            transition: opacity 1s ease;
        }
        .spinner {
            width: 50px; height: 50px;
            border: 3px solid rgba(50, 82, 123, 0.3);
            border-top-color: #32527B;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loading-overlay">
        <div class="spinner"></div>
        <h2 id="loading-text" class="blink">INICIALIZANDO HUB...</h2>
    </div>

    <div id="hud">
        <h2>ECOSISTEMA SGX</h2>
        <p>LOS 6 PILARES</p>
        <p id="status-text" style="color: #FDCC0D; margin-top: 10px;">SELECCIONA UN PILAR PARA EXPLORAR</p>
    </div>

    <button id="ExitButton">VOLVER AL HUB</button>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { ARButton } from 'three/addons/webxr/ARButton.js';
        import { VRButton } from 'three/addons/webxr/VRButton.js';
        import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
        import { KTX2Loader } from 'three/addons/loaders/KTX2Loader.js';
        import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
        import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';

        // --- DATA DE LOS PILARES ---
        const pillarsData = [
            { id: 'spark', name: 'SPARK', img: 'https://static.wixstatic.com/media/fe81a7_63357760452440439861456c01f55aab~mv2.png', obj: 'https://static.wixstatic.com/3d/fe81a7_1531afe43c6b461c91d99ba7d3dc5471.glb', meta: 'https://static.wixstatic.com/3d/fe81a7_843a1927c3e549608bc3efc9feea0fdf.glb' },
            { id: 'stage', name: 'STAGE', img: 'https://static.wixstatic.com/media/fe81a7_e29d558ee0cf47999842b043f93fad40~mv2.png', obj: 'https://static.wixstatic.com/3d/fe81a7_4b3620e9d7254d8e9928b9b69d868162.glb', meta: 'https://static.wixstatic.com/3d/fe81a7_2e086a18fa484f12b204953cd62086fe.glb' },
            { id: 'synthesize', name: 'SYNTHESIZE', img: 'https://static.wixstatic.com/media/fe81a7_d739f22494bf4d14b6392eb89987724b~mv2.png', obj: 'https://static.wixstatic.com/3d/fe81a7_956910e1488344ed9b8ec565ee530680.glb', meta: null },
            { id: 'story', name: 'STORY', img: 'https://static.wixstatic.com/media/fe81a7_5b8907aac0974f8fbd3cb2e9fc2ecce2~mv2.png', obj: 'https://static.wixstatic.com/3d/fe81a7_fc514d69af094bcd9aef6e753bdd9979.glb', meta: 'https://static.wixstatic.com/3d/fe81a7_c5cc1637970c441ca33e0ce3cd4f5f6b.glb' },
            { id: 'systems', name: 'SYSTEMS', img: 'https://static.wixstatic.com/media/fe81a7_ebc058d2a7a14ff1b6a41d411ce70550~mv2.png', obj: 'https://static.wixstatic.com/3d/fe81a7_b7c491b988984ed8a8632ff425cc0754.glb', meta: 'https://static.wixstatic.com/3d/fe81a7_928460424ee5494798da259d6fe587d3.glb' },
            { id: 'showcase', name: 'SHOWCASE', img: 'https://static.wixstatic.com/media/fe81a7_9832d363c6e74e9592dc67f211ce9e37~mv2.png', obj: 'https://static.wixstatic.com/3d/fe81a7_47a02d59fdf14f06887582964950a41e.glb', meta: 'https://static.wixstatic.com/3d/fe81a7_3bd01753acc140c58cfc9698790b6177.glb' }
        ];

        // --- 1. CORE ARCHITECTURE & RENDERER ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xd1d5db); 
        scene.fog = new THREE.FogExp2(0xd1d5db, 0.02); 

        const playerRig = new THREE.Group();
        playerRig.position.set(0, 0, 0); 
        scene.add(playerRig);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 200);
        camera.position.set(0, 1.6, 0); 
        playerRig.add(camera);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance", alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.xr.enabled = true; 
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0; 
        document.body.appendChild(renderer.domElement);

        // --- MANEJO DE CAPACIDADES WEBXR & GIROSCOPIO ---
        const vrBtn = VRButton.createButton(renderer);
        const arBtn = ARButton.createButton(renderer);
        document.body.appendChild(vrBtn);
        document.body.appendChild(arBtn);

        if ('xr' in navigator) {
            navigator.xr.isSessionSupported('immersive-vr').then(supported => {
                if(!supported) vrBtn.style.display = 'none';
            });
            navigator.xr.isSessionSupported('immersive-ar').then(supported => {
                if(!supported) arBtn.style.display = 'none';
            });
        } else {
            vrBtn.style.display = 'none';
            arBtn.style.display = 'none';
        }

        class CustomGyroControls {
            constructor(object) {
                this.object = object;
                this.enabled = true;
                this.deviceOrientation = {};
                this.screenOrientation = window.orientation || 0;
                this.onDeviceOrientationChangeEvent = (e) => { this.deviceOrientation = e; };
                this.onScreenOrientationChangeEvent = () => { this.screenOrientation = window.orientation || 0; };
                window.addEventListener('orientationchange', this.onScreenOrientationChangeEvent);
                window.addEventListener('deviceorientation', this.onDeviceOrientationChangeEvent);
            }
            disconnect() {
                window.removeEventListener('orientationchange', this.onScreenOrientationChangeEvent);
                window.removeEventListener('deviceorientation', this.onDeviceOrientationChangeEvent);
                this.enabled = false;
            }
            update() {
                if (!this.enabled) return;
                const alpha = this.deviceOrientation.alpha ? THREE.MathUtils.degToRad(this.deviceOrientation.alpha) : 0;
                const beta = this.deviceOrientation.beta ? THREE.MathUtils.degToRad(this.deviceOrientation.beta) : 0;
                const gamma = this.deviceOrientation.gamma ? THREE.MathUtils.degToRad(this.deviceOrientation.gamma) : 0;
                const orient = this.screenOrientation ? THREE.MathUtils.degToRad(this.screenOrientation) : 0;
                const euler = new THREE.Euler(beta, alpha, -gamma, 'YXZ');
                const q0 = new THREE.Quaternion();
                const q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5));
                const zee = new THREE.Vector3(0, 0, 1);
                this.object.quaternion.setFromEuler(euler);
                this.object.quaternion.multiply(q1);
                this.object.quaternion.multiply(q0.setFromAxisAngle(zee, -orient));
            }
        }

        let gyroControls = null;
        let useGyro = false;
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

        if (isMobile) {
            const gyroBtn = document.createElement('button');
            gyroBtn.id = 'GyroButton';
            gyroBtn.innerText = 'GIROSCOPIO';
            document.body.appendChild(gyroBtn);

            gyroBtn.addEventListener('click', () => {
                if (!gyroControls) {
                    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                        DeviceOrientationEvent.requestPermission().then(permissionState => {
                            if (permissionState === 'granted') {
                                enableGyro();
                            } else {
                                alert("Permiso de giroscopio denegado por el dispositivo.");
                            }
                        }).catch(console.error);
                    } else {
                        enableGyro();
                    }
                } else {
                    useGyro = false;
                    gyroControls.disconnect();
                    gyroControls = null;
                    
                    camera.quaternion.identity(); 
                    camera.position.set(0, 1.6, 0); 
                    controls.target.set(0, 1.6, -0.1);
                    controls.update();

                    gyroBtn.style.background = 'rgba(50, 82, 123, 0.9)';
                    gyroBtn.style.color = '#ffffff';
                    gyroBtn.innerText = 'GIROSCOPIO';
                }
            });

            function enableGyro() {
                gyroControls = new CustomGyroControls(camera);
                useGyro = true;
                const btn = document.getElementById('GyroButton');
                btn.style.background = '#FDCC0D';
                btn.style.color = '#111827';
                btn.innerText = 'GIRO ACTIVO';
            }
        }

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 1.6, -0.1); 
        controls.enableDamping = true;
        controls.enableZoom = false;
        controls.enablePan = false;
        controls.update();

        // --- 2. ENVIRONMENT & LIGHTING ---
        new RGBELoader()
            .load('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/textures/equirectangular/studio_small_08_1k.hdr', function (texture) {
                texture.mapping = THREE.EquirectangularReflectionMapping;
                scene.environment = texture; 
            });
        
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0xb0bec5, 0.6);
        scene.add(hemiLight);

        scene.add(new THREE.AmbientLight(0xffffff, 0.4)); 
        
        const cyanLight = new THREE.DirectionalLight(0x00FFFF, 1.0);
        cyanLight.position.set(-5, 5, 2);
        scene.add(cyanLight);

        const goldLight = new THREE.DirectionalLight(0xFDCC0D, 1.0);
        goldLight.position.set(5, 5, 2);
        scene.add(goldLight);

        // --- 3. GROUPS & LOADERS ---
        const hubGroup = new THREE.Group();
        scene.add(hubGroup);
        
        const metaverseGroup = new THREE.Group();
        scene.add(metaverseGroup);

        const interactables = []; 
        const floatingObjects = []; 
        let currentMaqueta = null; 
        let isTransitioning = false; 

        const dracoLoader = new DRACOLoader();
        dracoLoader.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/gltf/');
        const ktx2Loader = new KTX2Loader().setTranscoderPath('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/basis/').detectSupport(renderer);
        const gltfLoader = new GLTFLoader().setCrossOrigin('anonymous').setDRACOLoader(dracoLoader).setKTX2Loader(ktx2Loader).setMeshoptDecoder(MeshoptDecoder);
        const textureLoader = new THREE.TextureLoader().setCrossOrigin('anonymous');

        function enhancePBRMaterial(object) {
            object.traverse((child) => {
                if (child.isMesh && child.material) {
                    child.material.envMapIntensity = 1.5; 
                    
                    if (child.material.color) {
                        child.material.emissive = child.material.color;
                        child.material.emissiveIntensity = 0.2; 
                    }
                    if (child.material.map) {
                        child.material.emissiveMap = child.material.map;
                        child.material.emissiveIntensity = 0.2; 
                    }
                    
                    child.material.needsUpdate = true;
                }
            });
        }

        // --- 3.5 SAFE GRIDS ---
        // Cuadriculado en el piso color Amarillo SGX. Opacidad aumentada al 60% para máxima visibilidad
        const floorGrid = new THREE.GridHelper(100, 100, 0xFDCC0D, 0xFDCC0D);
        floorGrid.material.transparent = true;
        floorGrid.material.opacity = 0.6; 
        floorGrid.position.y = 0;
        hubGroup.add(floorGrid);

        renderer.xr.addEventListener('sessionstart', () => {
            const session = renderer.xr.getSession();
            if (session && session.mode === 'immersive-ar') {
                scene.background = null;
                scene.fog = null;
                floorGrid.visible = false;
            }
        });
        renderer.xr.addEventListener('sessionend', () => {
            scene.background = new THREE.Color(0xd1d5db); 
            scene.fog = new THREE.FogExp2(0xd1d5db, 0.02);
            floorGrid.visible = true;
            playerRig.position.set(0, 0, 0); 
        });

        // --- 4. HUB CREATION ---
        function createUIPanel(text, borderColor) {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = 'rgba(17, 24, 39, 0.9)'; 
            ctx.fillRect(0, 0, 512, 128);
            ctx.strokeStyle = borderColor;
            ctx.lineWidth = 8;
            ctx.strokeRect(4, 4, 504, 120);
            
            ctx.fillStyle = '#FDCC0D'; 
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.font = 'bold 36px Courier New'; 
            ctx.fillText(text, 256, 64);
            
            const tex = new THREE.CanvasTexture(canvas);
            tex.colorSpace = THREE.SRGBColorSpace; 
            return tex;
        }

        async function buildHub() {
            const radius = 3.5;
            const angleStep = (Math.PI * 2) / pillarsData.length;

            for (let i = 0; i < pillarsData.length; i++) {
                const data = pillarsData[i];
                const angle = i * angleStep;
                
                const px = Math.sin(angle) * radius;
                const pz = Math.cos(angle) * radius;

                const pillarGroup = new THREE.Group();
                pillarGroup.position.set(px, 0, pz);
                pillarGroup.lookAt(0, 0, 0); 
                hubGroup.add(pillarGroup);

                const pedGeo = new THREE.CylinderGeometry(0.5, 0.6, 0.2, 16);
                const pedMat = new THREE.MeshStandardMaterial({ color: 0x1f2937, metalness: 0.8, roughness: 0.2 });
                const pedestal = new THREE.Mesh(pedGeo, pedMat);
                pedestal.position.y = 0.1;
                pillarGroup.add(pedestal);

                const ringGeo = new THREE.TorusGeometry(0.5, 0.015, 16, 64);
                const ringMat = new THREE.MeshBasicMaterial({ color: 0x32527B }); 
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.position.y = 0.2;
                ring.rotation.x = Math.PI / 2;
                pillarGroup.add(ring);

                textureLoader.load(data.img, (tex) => {
                    tex.colorSpace = THREE.SRGBColorSpace; 
                    
                    const planeGeo = new THREE.PlaneGeometry(1.56, 1.56);
                    const planeMat = new THREE.MeshBasicMaterial({ 
                        map: tex, 
                        transparent: true, 
                        opacity: 1.0, 
                        toneMapped: false 
                    });
                    const plane = new THREE.Mesh(planeGeo, planeMat);
                    plane.position.set(0, 1.7, -0.2); 
                    pillarGroup.add(plane);
                });

                gltfLoader.load(data.obj, (gltf) => {
                    const model = gltf.scene;
                    enhancePBRMaterial(model); 

                    const box = new THREE.Box3().setFromObject(model);
                    const center = box.getCenter(new THREE.Vector3());
                    const size = box.getSize(new THREE.Vector3()).length();

                    model.position.x -= center.x;
                    model.position.y -= center.y;
                    model.position.z -= center.z;

                    const scale = 0.91 / size; 
                    model.scale.setScalar(scale);

                    const floater = new THREE.Group();
                    floater.position.set(0, 1.1, 0);
                    floater.add(model);
                    pillarGroup.add(floater);
                    floatingObjects.push(floater);
                });

                const uiGeo = new THREE.PlaneGeometry(0.8, 0.2);
                const texIdle = createUIPanel(`ENTRAR A ${data.name}`, '#32527B');
                const texHover = createUIPanel(`ENTRAR A ${data.name}`, '#00FFFF');
                
                const uiMat = new THREE.MeshBasicMaterial({ map: texIdle, transparent: true, toneMapped: false });
                const uiMesh = new THREE.Mesh(uiGeo, uiMat);
                uiMesh.position.set(0, 0.6, 0.2);
                uiMesh.rotation.x = -Math.PI * 0.1;
                
                uiMesh.userData = {
                    isButton: true,
                    texIdle: texIdle,
                    texHover: texHover,
                    onClick: () => loadMetaverse(data)
                };
                
                pillarGroup.add(uiMesh);
                interactables.push(uiMesh);
            }

            setTimeout(() => {
                document.getElementById('loading-overlay').style.opacity = '0';
                setTimeout(() => document.getElementById('loading-overlay').style.display = 'none', 1000);
            }, 1500);
        }

        buildHub();

        // --- 5. METAVERSE (MAQUETA) SYSTEM ---
        
        // Listener del botón HTML en pantalla
        document.getElementById('ExitButton').addEventListener('click', returnToHub);

        function loadMetaverse(data) {
            if (isTransitioning || currentMaqueta) return;

            if (!data.meta) {
                const status = document.getElementById('status-text');
                status.innerText = `> METAVERSO ${data.name} EN CONSTRUCCIÓN`;
                status.style.color = '#B87333';
                setTimeout(() => status.style.color = '#32527B', 2000);
                return;
            }

            isTransitioning = true; 
            hubGroup.visible = false;
            
            const overlay = document.getElementById('loading-overlay');
            document.getElementById('loading-text').innerText = `INICIANDO CONEXIÓN A MAQUETA...`;
            overlay.style.display = 'flex';
            setTimeout(() => overlay.style.opacity = '1', 10);

            gltfLoader.load(
                data.meta, 
                (gltf) => {
                    const model = gltf.scene;
                    enhancePBRMaterial(model); 
                    
                    model.position.set(0,0,0);
                    model.rotation.set(0,0,0);
                    model.scale.set(1,1,1);

                    const initialBox = new THREE.Box3().setFromObject(model);
                    const size = initialBox.getSize(new THREE.Vector3()).length();
                    const scale = 3.0 / size; 
                    model.scale.setScalar(scale);

                    const finalBox = new THREE.Box3().setFromObject(model);
                    const center = finalBox.getCenter(new THREE.Vector3());

                    model.position.x -= center.x;
                    model.position.y -= center.y - 1.0; 
                    model.position.z -= center.z;

                    metaverseGroup.add(model);
                    currentMaqueta = model;

                    if (!renderer.xr.isPresenting) {
                        camera.position.set(0, 2.0, 4.0);
                        controls.target.set(0, 1.0, 0); 
                        controls.enableZoom = true; 
                        controls.enablePan = true;  
                        controls.update();
                    } else {
                        playerRig.position.set(0, 0, 3.5);
                    }

                    overlay.style.opacity = '0';
                    setTimeout(() => {
                        overlay.style.display = 'none';
                        isTransitioning = false; 
                    }, 1000);
                    
                    // Mostrar botón 2D de salida
                    document.getElementById('ExitButton').style.display = 'block';
                    document.getElementById('status-text').innerText = `> EXPLORANDO MAQUETA: ${data.name}`;
                },
                (xhr) => {
                    if (xhr.lengthComputable) {
                        const percentComplete = Math.round((xhr.loaded / xhr.total) * 100);
                        document.getElementById('loading-text').innerText = `DESCARGANDO ${data.name}: ${percentComplete}%`;
                    } else {
                        const mbLoaded = (xhr.loaded / (1024 * 1024)).toFixed(1);
                        document.getElementById('loading-text').innerText = `DESCARGANDO ${data.name}: ${mbLoaded} MB...`;
                    }
                },
                (error) => {
                    console.error("Error al cargar la maqueta:", error);
                    document.getElementById('loading-text').innerText = `ERROR DE RED. VOLVIENDO AL HUB...`;
                    document.getElementById('loading-text').style.color = '#ff0000'; 
                    
                    setTimeout(() => {
                        returnToHub(); 
                        overlay.style.opacity = '0';
                        setTimeout(() => {
                            overlay.style.display = 'none';
                            document.getElementById('loading-text').style.color = '#00FFFF'; 
                            isTransitioning = false; 
                        }, 1000);
                    }, 3000);
                }
            );
        }

        function returnToHub() {
            if (isTransitioning && currentMaqueta === null) return;

            // Purgar todos los hijos del grupo de maquetas
            while (metaverseGroup.children.length > 0) {
                metaverseGroup.remove(metaverseGroup.children[0]);
            }
            currentMaqueta = null;
            
            if (!renderer.xr.isPresenting) {
                camera.position.set(0, 1.6, 0);
                controls.target.set(0, 1.6, -0.1);
                controls.enableZoom = false; 
                controls.enablePan = false;  
                controls.update();
            } else {
                playerRig.position.set(0, 0, 0);
            }

            hubGroup.visible = true;
            document.getElementById('ExitButton').style.display = 'none';
            
            // Texto restaurado a neutral, sin confirmaciones distractoras
            document.getElementById('status-text').innerText = `> SELECCIONA UN PILAR PARA EXPLORAR`;
        }

        // --- 6. RAYCASTING & INTERACTION ---
        const raycaster = new THREE.Raycaster();
        const tempMatrix = new THREE.Matrix4();
        let hoveredObject = null;

        const controller1 = renderer.xr.getController(0);
        controller1.addEventListener('selectstart', onSelectStart);
        playerRig.add(controller1);

        const controller2 = renderer.xr.getController(1);
        controller2.addEventListener('selectstart', onSelectStart);
        playerRig.add(controller2);

        const controllerModelFactory = new XRControllerModelFactory();
        const grip1 = renderer.xr.getControllerGrip(0);
        grip1.add(controllerModelFactory.createControllerModel(grip1));
        playerRig.add(grip1);
        const grip2 = renderer.xr.getControllerGrip(1);
        grip2.add(controllerModelFactory.createControllerModel(grip2));
        playerRig.add(grip2);

        const laserGeometry = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0, -1)]);
        const laserMaterial = new THREE.LineBasicMaterial({ color: 0x00FFFF, blending: THREE.AdditiveBlending });
        const laser1 = new THREE.Line(laserGeometry, laserMaterial); laser1.scale.z = 5; controller1.add(laser1);
        const laser2 = new THREE.Line(laserGeometry, laserMaterial); laser2.scale.z = 5; controller2.add(laser2);

        const mouse = new THREE.Vector2();
        window.addEventListener('pointermove', (e) => {
            if (renderer.xr.isPresenting) return;
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            checkIntersections(raycaster);
        });

        window.addEventListener('pointerdown', (e) => {
            if (renderer.xr.isPresenting) return;
            if (hoveredObject) hoveredObject.userData.onClick();
        });

        function onSelectStart(event) {
            tempMatrix.identity().extractRotation(event.target.matrixWorld);
            raycaster.ray.origin.setFromMatrixPosition(event.target.matrixWorld);
            raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);
            
            const activeInteractables = interactables.filter(obj => obj.visible && (obj.parent === hubGroup ? hubGroup.visible : true));
            const intersects = raycaster.intersectObjects(activeInteractables, false);
            if (intersects.length > 0) {
                intersects[0].object.userData.onClick();
            }
        }

        function checkIntersections(rc) {
            const activeInteractables = interactables.filter(obj => obj.visible && (obj.parent === hubGroup ? hubGroup.visible : true));
            const intersects = rc.intersectObjects(activeInteractables, false);

            if (intersects.length > 0) {
                const object = intersects[0].object;
                if (hoveredObject !== object) {
                    if (hoveredObject) hoveredObject.material.map = hoveredObject.userData.texIdle;
                    hoveredObject = object;
                    hoveredObject.material.map = hoveredObject.userData.texHover;
                    document.body.style.cursor = 'pointer';
                }
            } else {
                if (hoveredObject) {
                    hoveredObject.material.map = hoveredObject.userData.texIdle;
                    hoveredObject = null;
                    document.body.style.cursor = 'default';
                }
            }
        }

        function updateVRRaycasting() {
            let rc = new THREE.Raycaster();
            const activeInteractables = interactables.filter(obj => obj.visible && (obj.parent === hubGroup ? hubGroup.visible : true));
            
            tempMatrix.identity().extractRotation(controller1.matrixWorld);
            rc.ray.origin.setFromMatrixPosition(controller1.matrixWorld);
            rc.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);
            let intersects = rc.intersectObjects(activeInteractables, false);
            
            if(intersects.length === 0) {
                tempMatrix.identity().extractRotation(controller2.matrixWorld);
                rc.ray.origin.setFromMatrixPosition(controller2.matrixWorld);
                rc.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);
                intersects = rc.intersectObjects(activeInteractables, false);
            }
            checkIntersections(rc);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        renderer.setAnimationLoop((time) => {
            if (useGyro && gyroControls) {
                gyroControls.update();
            } else {
                controls.update(); 
            }

            if (hubGroup.visible) {
                floatingObjects.forEach((obj, index) => {
                    obj.position.y = 1.1 + Math.sin(time * 0.002 + index) * 0.1;
                });
            }

            if (renderer.xr.isPresenting) {
                document.getElementById('hud').style.display = 'none';
                // Aseguramos que el botón HTML se oculte en VR
                document.getElementById('ExitButton').style.display = 'none';
                updateVRRaycasting();
            } else {
                document.getElementById('hud').style.display = 'block';
                // Restaurar visibilidad si estamos dentro de una maqueta
                if (currentMaqueta) document.getElementById('ExitButton').style.display = 'block';
            }

            renderer.render(scene, camera);
        });
    </script>
</body>
</html>
