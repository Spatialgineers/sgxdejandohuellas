<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dejando Huellas // VJ Core</title>
    <!-- Tipografías actualizadas para un look más empático e institucional pero moderno -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Paleta Oficial Dejando Huellas */
            --dh-purple: #4B156E;
            --dh-gold: #D4A373;
            --dh-pink: #F7B0CC;
            --dh-white: #FFFFFF;
            
            /* Fondos inmersivos basados en el morado vibrante oscurecido */
            --dh-bg-deep: #0a0310;
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: var(--dh-bg-deep);
            font-family: 'Roboto Mono', monospace;
            color: var(--dh-white);
            touch-action: none;
        }

        /* --- ASSETS OVERLAYS (VJ SYSTEM) --- */
        .visual-overlay {
            position: absolute;
            z-index: 5;
            pointer-events: none;
            object-fit: contain;
            filter: drop-shadow(0 5px 15px rgba(75, 21, 110, 0.5)); /* Sombra morada */
        }

        #visual-center {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 45vw;
            max-height: 45vh;
            transition: filter 0.1s ease-out, transform 0.05s linear; 
        }

        /* Logos Fijos en Esquinas */
        #visual-bl {
            bottom: 30px;
            left: 30px;
            max-width: 15vw;
            max-height: 12vh;
            display: block;
        }

        #visual-br {
            bottom: 30px;
            right: 30px;
            max-width: 15vw;
            max-height: 12vh;
            display: block;
        }

        /* --- WATERMARK (CENTRO INFERIOR) --- */
        #sgx-watermark {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            font-family: 'Montserrat', sans-serif;
            font-weight: 400; 
            font-size: clamp(0.7rem, 1vw, 0.9rem);
            color: var(--dh-white);
            letter-spacing: 6px;
            text-transform: uppercase;
            text-shadow: 0 0 5px var(--dh-pink), 0 0 15px var(--dh-pink); /* Glow en Rosa Pastel */
            pointer-events: none;
            text-align: center;
            opacity: 1;
            transition: opacity 0.5s ease;
        }

        .restore-hint {
            display: block;
            font-size: 0.5em;
            opacity: 0;
            margin-top: 5px;
            letter-spacing: 3px;
            color: var(--dh-gold);
            transition: opacity 0.5s ease;
        }

        /* --- UI ELEMENTS --- */
        #hud-container {
            position: absolute;
            top: 30px;
            left: 30px;
            z-index: 20;
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 80vw;
            transition: opacity 0.5s ease;
        }

        .dh-panel {
            background: rgba(10, 3, 16, 0.65); /* Morado extra oscuro */
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(247, 176, 204, 0.3); /* Borde rosa sutil */
            border-left: 4px solid var(--dh-gold); /* Acento Café Arena */
            padding: 15px 20px;
            border-radius: 8px; /* Bordes más amigables (ya no 45 deg) por el tema de mascotas */
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 20px rgba(75, 21, 110, 0.4);
        }

        .dh-title {
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(1rem, 1.5vw, 1.4rem);
            font-weight: 900;
            color: var(--dh-pink);
            margin: 0 0 5px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(247, 176, 204, 0.5);
        }

        .dh-telemetry {
            display: flex;
            gap: 20px;
            font-size: 0.75rem;
            color: #e2e8f0;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 10px;
            margin-bottom: 10px;
        }

        .metric { display: flex; flex-direction: column; }
        .metric-value { color: var(--dh-white); font-weight: 700; font-size: 1rem; text-shadow: 0 0 5px var(--dh-gold); }

        /* --- BOTONES --- */
        #audio-btn {
            background: rgba(212, 163, 115, 0.1);
            color: var(--dh-gold);
            border: 1px solid var(--dh-gold);
            padding: 10px 15px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        #audio-btn:hover { background: var(--dh-gold); color: var(--dh-purple); box-shadow: 0 0 15px var(--dh-gold); }

        .upload-section {
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-top: 10px;
            border-top: 1px solid rgba(247, 176, 204, 0.3);
            padding-top: 10px;
        }

        .upload-btn {
            background: transparent;
            color: var(--dh-white);
            border: 1px solid rgba(212, 163, 115, 0.5);
            font-family: 'Roboto Mono', monospace;
            font-size: 0.65rem;
            padding: 8px 10px;
            cursor: pointer;
            border-radius: 4px;
            transition: 0.2s;
            text-align: left;
            display: flex;
            justify-content: space-between;
        }
        .upload-btn:hover { background: var(--dh-gold); color: var(--dh-purple); font-weight: bold; }
        .upload-btn span { color: var(--dh-pink); }

        #btn-cinematic {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 30;
            background: rgba(75, 21, 110, 0.5);
            border: 1px solid var(--dh-pink);
            color: var(--dh-white);
            padding: 10px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(247, 176, 204, 0.3);
        }
        #btn-cinematic:hover { background: var(--dh-pink); color: var(--dh-purple); transform: scale(1.1); }

        #cinematic-restore {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 15;
            pointer-events: none;
        }

        /* --- OVERRIDE LIL-GUI CON LA PALETA DE LA MARCA --- */
        .lil-gui { 
            --background-color: rgba(75, 21, 110, 0.85); /* Morado Vibrante */
            --text-color: #ffffff;
            --title-background-color: #4B156E;
            --widget-color: rgba(212, 163, 115, 0.3); /* Café Arena oscuro */
            --hover-color: rgba(212, 163, 115, 0.6);
            --focus-color: #F7B0CC; /* Rosa Pastel */
            font-family: 'Roboto Mono', monospace;
            border: 1px solid var(--dh-pink);
            right: 20px !important;
            top: 70px !important;
            border-radius: 8px !important;
            transition: opacity 0.5s ease;
            z-index: 20;
        }
        .lil-gui .title { font-family: 'Montserrat', sans-serif; font-weight: bold; letter-spacing: 1px; }
        
        #audio-meter { width: 100%; height: 4px; background: rgba(255,255,255,0.1); margin-top: 5px; border-radius: 2px; }
        #audio-level { height: 100%; width: 0%; background: var(--dh-gold); transition: width 0.1s; border-radius: 2px; box-shadow: 0 0 8px var(--dh-gold); }
    </style>
</head>
<body>

    <!-- OVERLAYS DE IMÁGENES -->
    <img id="visual-center" class="visual-overlay" style="display:none;" alt="Center Visual">
    
    <!-- Auspiciadores Fijos -->
    <img id="visual-bl" class="visual-overlay" src="https://static.wixstatic.com/media/fe81a7_68a5da16aefe4e09aee2c6679b885c63~mv2.png" alt="Left Logo">
    <img id="visual-br" class="visual-overlay" src="https://static.wixstatic.com/media/fe81a7_0f3430b416ef4d1e8c065fe5251716cd~mv2.png" alt="Right Logo">

    <!-- MARCA DE AGUA CENTRADA Y GLOWY -->
    <div id="sgx-watermark">
        POWERED BY SPATIALGINEERS
        <span class="restore-hint" id="restore-hint">[ CLICK PARA RESTAURAR UI ]</span>
    </div>

    <button id="btn-cinematic" title="Ocultar UI (Modo Cinemático)">👁️</button>
    <div id="cinematic-restore"></div>

    <div id="hud-container">
        <button id="audio-btn">🎤 SENSOR ACÚSTICO</button>
        <div class="dh-panel">
            <h1 class="dh-title">DEJANDO HUELLAS FEST</h1>
            <div class="dh-telemetry">
                <div class="metric">
                    <span>HUELLAS</span>
                    <span class="metric-value" id="count-display">8,000</span>
                </div>
                <div class="metric">
                    <span>RESONANCIA</span>
                    <span class="metric-value" id="fps-display">00.0</span>
                </div>
            </div>
            <div id="audio-meter"><div id="audio-level"></div></div>

            <!-- ASSETS INJECTOR (Solo Central) -->
            <div class="upload-section">
                <span style="font-size: 0.65rem; color: var(--dh-white); letter-spacing: 1px; font-family: 'Montserrat', sans-serif;">// VJ ASSETS INJECTOR</span>
                <button class="upload-btn" onclick="document.getElementById('file-center').click()">LOGO CENTRAL (AUDIO-REACT) <span>[+]</span></button>
            </div>
            <input type="file" id="file-center" accept="image/*" style="display:none;">
        </div>
    </div>

    <script type="module">
        import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
        import GUI from 'https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js';

        // Global Error Catcher
        window.onerror = function(msg, url, lineNo) {
            const errDiv = document.createElement('div');
            errDiv.style.color = '#F7B0CC'; errDiv.style.fontSize = '10px'; errDiv.style.fontFamily = 'monospace';
            errDiv.innerText = `[SYS_ERROR]: ${msg}`;
            document.getElementById('hud-container').appendChild(errDiv);
            return false;
        };

        // --- 0. ASSETS INJECTOR LOCAL (SOLO CENTRAL) ---
        document.getElementById('file-center').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if(file) {
                const img = document.getElementById('visual-center');
                img.src = URL.createObjectURL(file);
                img.style.display = 'block';
            }
        });

        // --- 1. UI CINEMATIC TOGGLE ---
        const btnCinematic = document.getElementById('btn-cinematic');
        const hudContainer = document.getElementById('hud-container');
        const cinematicRestore = document.getElementById('cinematic-restore');
        const restoreHint = document.getElementById('restore-hint');
        let uiVisible = true;

        btnCinematic.addEventListener('click', () => {
            uiVisible = false;
            hudContainer.style.opacity = '0'; hudContainer.style.pointerEvents = 'none';
            btnCinematic.style.opacity = '0'; btnCinematic.style.pointerEvents = 'none';
            if(window.sgxGui) { window.sgxGui.domElement.style.opacity = '0'; window.sgxGui.domElement.style.pointerEvents = 'none'; }
            restoreHint.style.opacity = '0.8';
            cinematicRestore.style.pointerEvents = 'auto'; 
        });

        cinematicRestore.addEventListener('click', () => {
            if(!uiVisible) {
                uiVisible = true;
                hudContainer.style.opacity = '1'; hudContainer.style.pointerEvents = 'auto';
                btnCinematic.style.opacity = '1'; btnCinematic.style.pointerEvents = 'auto';
                if(window.sgxGui) { window.sgxGui.domElement.style.opacity = '1'; window.sgxGui.domElement.style.pointerEvents = 'auto'; }
                restoreHint.style.opacity = '0';
                cinematicRestore.style.pointerEvents = 'none';
            }
        });

        // --- 2. CORE ARCHITECTURE SETUP ---
        const scene = new THREE.Scene();
        // Neblina con el color "Morado Vibrante" extremadamente oscurecido
        scene.fog = new THREE.FogExp2(0x0a0310, 0.012);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 40); 

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        // Fondo base utilizando una variante muy oscura del Morado Vibrante para mantener el contraste
        renderer.setClearColor(0x0a0310);
        document.body.appendChild(renderer.domElement);

        // --- 3. HARDWARE TEXTURE LOADER ---
        const loader = new THREE.TextureLoader();
        loader.setCrossOrigin('anonymous');
        const cacheBuster = "?v=" + Date.now();
        // Huella base sin background
        const pawUrl = "https://static.wixstatic.com/media/fe81a7_15bf73d9cc0246549b2d9dbb41dc130b~mv2.png" + cacheBuster;
        const particleTex = loader.load(pawUrl);

        // Material Additive Blending para efecto luminoso
        const material = new THREE.MeshBasicMaterial({
            color: 0xffffff,
            map: particleTex, 
            transparent: true,
            opacity: 0.9,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            side: THREE.DoubleSide
        });

        // --- 4. DATA STRUCTURE & BRAND COLORS ---
        const PARAMS = {
            count: 8000, 
            baseEnergy: 0.3,      
            swarmVelocity: 0.8,   
            pawScale: 1.0,
            parallaxWarp: 0.03,   
            audioSensitivity: 1.0,
            autoPilot: true
        };

        // INTEGRACIÓN DE LA PALETA "DEJANDO HUELLAS"
        const BRAND_COLORS = [
            new THREE.Color(0x4B156E), // Morado Vibrante
            new THREE.Color(0xD4A373), // Café Arena / Dorado Suave
            new THREE.Color(0xF7B0CC), // Rosa Pastel
            new THREE.Color(0xFFFFFF)  // Blanco Puro
        ];

        // Escalas adaptadas al peso visual (Morado más profundo, Oro más grande, Rosa intermedio, Blanco pequeño/brillante)
        const COLOR_SCALES = [1.2, 1.8, 1.0, 0.6];

        const geometry = new THREE.PlaneGeometry(0.5, 0.5); 
        const instancedMesh = new THREE.InstancedMesh(geometry, material, PARAMS.count);
        scene.add(instancedMesh);

        const stride = 9;
        const pData = new Float32Array(PARAMS.count * stride); 
        const dummy = new THREE.Object3D();
        const color = new THREE.Color();
        const localCameraPos = new THREE.Vector3(); 

        for (let i = 0; i < PARAMS.count; i++) {
            const idx = i * stride;
            pData[idx + 0] = (Math.random() - 0.5) * 160; 
            pData[idx + 1] = (Math.random() - 0.5) * 120; 
            pData[idx + 2] = (Math.random() - 0.5) * 160 - 20; 
            pData[idx + 3] = (Math.random() * 0.5 + 0.1);  
            pData[idx + 4] = Math.random() * 100;          

            // Asignación de colores de la marca
            const cIdx = Math.floor(Math.random() * BRAND_COLORS.length);
            pData[idx + 5] = COLOR_SCALES[cIdx];           
            
            pData[idx + 6] = (Math.random() - 0.5) * 5.0;  
            pData[idx + 7] = (Math.random() - 0.5) * 2.0;  
            pData[idx + 8] = (Math.random() - 0.5) * 5.0;  

            color.copy(BRAND_COLORS[cIdx]);
            // Mezclamos un poco de blanco para mejorar el brillo (Additive Blending funciona mejor con lumas altos)
            if(Math.random() > 0.6) color.lerp(new THREE.Color(0xffffff), 0.3); 
            instancedMesh.setColorAt(i, color);
        }
        instancedMesh.instanceColor.needsUpdate = true;

        // --- 5. AUDIO ENGINE ---
        let audioCtx, analyser, dataArray;
        let audioActive = false;
        let smoothBass = 0, smoothMids = 0, smoothTreble = 0;

        document.getElementById('audio-btn').addEventListener('click', async () => {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 256;
                const source = audioCtx.createMediaStreamSource(stream);
                source.connect(analyser);
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                
                audioActive = true;
                const btn = document.getElementById('audio-btn');
                btn.innerText = "⚡ SENSOR ACTIVO";
                btn.style.background = "var(--dh-gold)";
                btn.style.color = "var(--dh-purple)";
                setTimeout(() => btn.style.display = 'none', 1500);

                if (audioCtx.state === 'suspended') await audioCtx.resume();
            } catch (err) {
                console.error("Audio denied:", err);
            }
        });

        function updateAudioData() {
            if (!audioActive) return;
            analyser.getByteFrequencyData(dataArray);
            
            let b = 0, m = 0, t = 0;
            for(let i = 0; i < 8; i++) b += dataArray[i];    
            for(let i = 8; i < 24; i++) m += dataArray[i];   
            for(let i = 24; i < 64; i++) t += dataArray[i];
            
            const rawBass = (b / 8) / 255;
            const rawMids = (m / 16) / 255;
            const rawTreble = (t / 40) / 255;

            smoothBass += (rawBass - smoothBass) * 0.15;
            smoothMids += (rawMids - smoothMids) * 0.15;
            smoothTreble += (rawTreble - smoothTreble) * 0.15;

            document.getElementById('audio-level').style.width = `${Math.min(smoothBass * 100 * PARAMS.audioSensitivity, 100)}%`;
        }

        // --- 6. INTERACTION ---
        const mouse = new THREE.Vector2();
        const targetPos = new THREE.Vector3(0, 0, 0);
        const currentPos = new THREE.Vector3(0, 0, 0);

        function handleInput(clientX, clientY) {
            PARAMS.autoPilot = false; 
            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;
            targetPos.x = mouse.x * 15; 
            targetPos.y = mouse.y * 10;
        }

        window.addEventListener('pointermove', (e) => handleInput(e.clientX, e.clientY));
        window.addEventListener('touchmove', (e) => {
            if(e.touches.length > 0) handleInput(e.touches[0].clientX, e.touches[0].clientY);
        });
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- 7. TACTICAL GUI ---
        try {
            window.sgxGui = new GUI({ title: 'CONTROL DINÁMICO' });
            window.sgxGui.add(PARAMS, 'audioSensitivity', 0.1, 3.0).name('Reactividad Musical');
            window.sgxGui.add(PARAMS, 'baseEnergy', 0.05, 1.0).name('Energía Base');
            window.sgxGui.add(PARAMS, 'swarmVelocity', 0.0, 3.0).name('Velocidad Estelar');
            window.sgxGui.add(PARAMS, 'pawScale', 0.1, 3.0).name('Tamaño Huellas');
        } catch(e) {}

        // --- 8. RENDER LOOP & VJ EFFECTS ---
        const clock = new THREE.Clock();
        let frameCount = 0;
        let lastTime = performance.now();
        let globalElapsedTime = 0;
        const fpsDisplay = document.getElementById('fps-display');
        const centerImage = document.getElementById('visual-center');

        function updateSystem() {
            requestAnimationFrame(updateSystem);
            updateAudioData();

            const dt = clock.getDelta(); 
            const audioMult = audioActive ? (smoothBass * PARAMS.audioSensitivity) : 0;
            const flowSpeed = PARAMS.baseEnergy + (audioActive ? smoothMids * PARAMS.audioSensitivity : 0);
            
            globalElapsedTime += dt * flowSpeed;
            const moveDt = dt * (PARAMS.swarmVelocity + audioMult * 3.0); 
            
            if (PARAMS.autoPilot) {
                targetPos.x = Math.sin(globalElapsedTime * 0.1) * 8;
                targetPos.y = Math.cos(globalElapsedTime * 0.08) * 5;
            }

            // Parallax Suave
            currentPos.x += (targetPos.x - currentPos.x) * PARAMS.parallaxWarp;
            currentPos.y += (targetPos.y - currentPos.y) * PARAMS.parallaxWarp;

            camera.position.x = currentPos.x * 0.3;
            camera.position.y = currentPos.y * 0.3;
            camera.position.z = 40 - (audioMult * 4.0); 
            camera.lookAt(currentPos.x * 0.05, currentPos.y * 0.05, 0);

            // Rotación universo
            instancedMesh.rotation.y += (0.0003 + flowSpeed * 0.001);
            instancedMesh.updateMatrixWorld();

            localCameraPos.copy(camera.position);
            instancedMesh.worldToLocal(localCameraPos);

            // Resplandor de material pulsa suavemente
            material.opacity = 0.5 + (audioMult * 0.4);

            // --- DEFORMACIÓN TECHNO DEL LOGO CENTRAL (Branding Mode) ---
            if (centerImage.style.display === 'block') {
                const scale = 1 + (smoothBass * PARAMS.audioSensitivity * 0.4);
                const skewX = (smoothTreble - 0.2) * 15 * PARAMS.audioSensitivity; 
                const skewY = (smoothMids - 0.2) * 10 * PARAMS.audioSensitivity;
                
                centerImage.style.transform = `translate(-50%, -50%) perspective(600px) scale(${scale}) rotateX(${skewY}deg) rotateY(${skewX}deg)`;
                
                // Efecto de brillo reacciona al bajo, utilizando el Rosa Pastel o Café Arena como resplandor
                const glow = smoothBass * 35 * PARAMS.audioSensitivity;
                const hue = (globalElapsedTime * 40) % 360; // Desplazamiento sutil de tono
                centerImage.style.filter = `hue-rotate(${hue}deg) drop-shadow(0 0 ${glow}px var(--dh-pink))`;
            }

            // Loop Matemático de Partículas
            for (let i = 0; i < PARAMS.count; i++) {
                const idx = i * stride;
                
                pData[idx + 0] += pData[idx + 6] * pData[idx + 3] * moveDt; 
                pData[idx + 1] += pData[idx + 7] * pData[idx + 3] * moveDt; 
                pData[idx + 2] += pData[idx + 8] * pData[idx + 3] * moveDt; 

                // Lógica Warp (Teletransporte en los bordes)
                if (pData[idx + 0] > 120) pData[idx + 0] -= 240;
                if (pData[idx + 0] < -120) pData[idx + 0] += 240;
                if (pData[idx + 1] > 80) pData[idx + 1] -= 160;
                if (pData[idx + 1] < -80) pData[idx + 1] += 160;
                if (pData[idx + 2] > 60) pData[idx + 2] -= 160;
                if (pData[idx + 2] < -100) pData[idx + 2] += 160;

                let x = pData[idx + 0];
                let y = pData[idx + 1];
                let z = pData[idx + 2];
                const seed = pData[idx + 4];
                const colorScale = pData[idx + 5]; 

                const dist = Math.sqrt(x*x + y*y + z*z);
                if(dist > 0 && audioActive) {
                    x += (x / dist) * audioMult * 2.0;
                    y += (y / dist) * audioMult * 2.0;
                    z += (z / dist) * audioMult * 2.0;
                }

                dummy.position.set(x, y, z);
                
                const s = PARAMS.pawScale * colorScale * (0.7 + 0.3 * Math.sin(seed + globalElapsedTime)) * (1.0 + audioMult * 0.8);
                dummy.scale.set(s, s, s);

                dummy.lookAt(localCameraPos);
                
                dummy.updateMatrix();
                instancedMesh.setMatrixAt(i, dummy.matrix);
            }

            instancedMesh.instanceMatrix.needsUpdate = true;
            renderer.render(scene, camera);

            // Telemetría
            frameCount++;
            const now = performance.now();
            if (now - lastTime >= 500) {
                fpsDisplay.innerText = `${((frameCount * 1000) / (now - lastTime)).toFixed(1)}`;
                frameCount = 0;
                lastTime = now;
            }
        }

        updateSystem();
    </script>
