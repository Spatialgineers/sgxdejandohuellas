<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestural Remix Engine</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: monospace; }
        #ui { position: absolute; top: 20px; left: 20px; z-index: 10; color: #0f0; }
        canvas#output_canvas { position: absolute; bottom: 10px; right: 10px; width: 200px; border: 1px solid #333; }
        button { background: #0f0; color: #000; border: none; padding: 10px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div id="ui">
    <h1>REMIXER 2E_CORE</h1>
    <button id="startBtn">INITIALIZE SYSTEM</button>
    <p id="status">Status: Waiting for input...</p>
</div>
<video id="input_video" style="display:none"></video>
<canvas id="output_canvas"></canvas>

<script>
const videoElement = document.getElementById('input_video');
const canvasElement = document.getElementById('output_canvas');
const canvasCtx = canvasElement.getContext('2d');
const startBtn = document.getElementById('startBtn');

// --- AUDIO ENGINE ---
let audioCtx, source, filter, analyser;
function initAudio() {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    filter = audioCtx.createBiquadFilter();
    analyser = audioCtx.createAnalyser();
    
    const audio = new Audio();
    audio.src = 'TU_ARCHIVO.mp3'; // <--- PON TU MP3 AQUÍ
    audio.crossOrigin = "anonymous";
    audio.loop = true;

    source = audioCtx.createMediaElementSource(audio);
    source.connect(filter);
    filter.connect(analyser);
    analyser.connect(audioCtx.destination);
    
    filter.type = 'lowpass';
    filter.frequency.value = 20000;
    audio.play();
}

// --- THREE.JS ENGINE ---
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const geometry = new THREE.IcosahedronGeometry(1, 15);
const material = new THREE.MeshNormalMaterial({ wireframe: true });
const mesh = new THREE.Mesh(geometry, material);
scene.add(mesh);
camera.position.z = 3;

// --- MEDIAPIPE LOGIC ---
const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.7, minTrackingConfidence: 0.7 });

hands.onResults((results) => {
    canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
    if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const hand = results.multiHandLandmarks[0];
        
        // Mapeo 1: Distancia Pulgar(4)-Índice(8) -> Filtro de Audio
        const dist = Math.hypot(hand[4].x - hand[8].x, hand[4].y - hand[8].y);
        if(filter) filter.frequency.setTargetAtTime(dist * 8000 + 200, audioCtx.currentTime, 0.05);

        // Mapeo 2: Posición Y de la mano -> Escala y Rotación 3D
        const yPos = 1 - hand[0].y; 
        mesh.scale.setScalar(yPos * 2 + 0.5);
        mesh.rotation.y += 0.05;
        mesh.rotation.x = hand[0].x * 5;
    }
});

const cameraHandler = new Camera(videoElement, {
    onFrame: async () => { await hands.send({image: videoElement}); },
    width: 640, height: 480
});

startBtn.addEventListener('click', () => {
    initAudio();
    cameraHandler.start();
    startBtn.style.display = 'none';
    document.getElementById('status').innerText = "SYSTEM ACTIVE - MOVE HANDS";
});

function animate() {
    requestAnimationFrame(animate);
    renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
